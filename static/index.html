<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="6OKkd9NOPkGHJFclS7QOrR">
<head data-page-node-id="hfnBdPaUhWl5Vnu6cA12F3">
<meta charset="UTF-8" data-page-node-id="BSXfXWYGRa0pQTtnvA3prz" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="VdQuWVPyFHIIslGsPyELdr" />
<title>Level 5 · ReAct Agent</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e4e6eb;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --ok: #059669;
    --err: #dc2626;
    --soft: #f3f4f6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    flex: none; padding: 12px 20px; background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .badge {
    font-size: 12px; color: var(--accent); background: var(--accent-soft);
    padding: 2px 8px; border-radius: 999px; font-weight: 500;
  }
  header .hint { margin-left: auto; font-size: 12px; color: var(--muted); }

  #log {
    flex: 1; overflow-y: auto; padding: 24px 20px 8px;
    max-width: 820px; width: 100%; margin: 0 auto;
  }

  .msg { margin-bottom: 22px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--accent); color: #fff; padding: 9px 14px;
    border-radius: 14px 14px 4px 14px; max-width: 78%; white-space: pre-wrap;
  }
  .msg.bot {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
  }

  .steps { margin-bottom: 10px; }
  .step-row {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--border);
  }
  .step-row:last-child { border-bottom: none; }
  .step-no {
    flex: none; font-size: 11px; color: var(--muted); background: var(--soft);
    border-radius: 5px; padding: 1px 6px; margin-top: 2px;
  }
  .tool-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 600; color: var(--accent); }
  .tool-args { color: var(--muted); font-family: ui-monospace, Menlo, monospace;
    font-size: 12px; word-break: break-all; }
  .tool-out { color: var(--text); word-break: break-word; white-space: pre-wrap; }
  .tool-out.fail { color: var(--err); }
  .arrow { color: var(--muted); margin: 0 4px; }

  details.think { margin: 6px 0 10px; }
  details.think summary {
    cursor: pointer; color: var(--muted); font-size: 13px; user-select: none;
  }
  details.think .body {
    color: var(--muted); font-size: 13px; background: var(--soft);
    border-radius: 8px; padding: 8px 10px; margin-top: 6px; white-space: pre-wrap;
  }

  .answer { white-space: pre-wrap; word-break: break-word; min-height: 1.6em; }
  .waiting { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .waiting::after {
    content: ""; display: inline-block; width: 7px; height: 13px; margin-left: 4px;
    background: var(--accent); vertical-align: -2px;
    animation: blink 1s steps(2, start) infinite;
  }
  .cursor {
    display: inline-block; width: 7px; height: 15px; background: var(--accent);
    vertical-align: -2px; animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  .stats {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap;
  }
  .stats b { color: var(--text); font-weight: 600; }
  .err-line { color: var(--err); font-size: 13px; }

  footer {
    flex: none; background: var(--bg); border-top: 1px solid var(--border);
    padding: 12px 20px 18px;
  }
  .composer {
    max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; font: inherit; background: var(--card); color: var(--text);
    max-height: 160px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    flex: none; height: 40px; padding: 0 18px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: var(--soft); color: var(--text); }
  .tip { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body data-page-node-id="H6howGdgGKsxPBYX397Tvd">

<header data-page-node-id="8u5d74TjIsHak6h5aR1v2R">
  <h1 data-page-node-id="VNWEWKLv8KTPCpqVildjQB">Level 5 · ReAct Agent</h1>
  <span class="badge" data-page-node-id="cA2yzfP0Mw5ksdGcfDjr63">流式 SSE</span>
  <span class="hint" data-page-node-id="Xj1WgFanDjpxPIsJtVMkxX">手写 ReAct 循环 · 工具调用 · trace 打点</span>
</header>

<div id="log" data-page-node-id="U0z3qXNajkj4z252E6p7Y0"></div>

<footer data-page-node-id="tSBGgcOrYghCwPZ5Yd1HHz">
  <div class="composer" data-page-node-id="OjAGijwVG7G62BjSqxnNQe">
    <textarea id="input" rows="1" placeholder="问点需要多步才能答的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" data-page-node-id="PG7XG2WSIgdSGrePg7fVbF">发送</button>
    <button id="stop" class="ghost" style="display:none" data-page-node-id="PnL32CwMCkMFtnb2920IaX">停止</button>
  </div>
  <div class="tip" data-page-node-id="HyMcCOfd84SEI2dGGhJWZU">试试：「项目里有哪些 Python 文件？读一下 main.py 说说是干什么的」（免费档 18-23 点限流严重，被限流会自动重试；早晚跑最顺）</div>
</footer>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop');
let source = null;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function scrollDown() { log.scrollTop = log.scrollHeight; }

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

sendBtn.addEventListener('click', send);
stopBtn.addEventListener('click', stop);

function send() {
  const q = input.value.trim();
  if (!q || source) return;

  // 用户气泡
  const userMsg = el('div', 'msg user');
  userMsg.appendChild(el('div', 'bubble', q));
  log.appendChild(userMsg);

  // 助手容器
  const bot = el('div', 'msg bot');
  const steps = el('div', 'steps');
  const answer = el('div', 'answer');
  const cursor = el('span', 'cursor');
  const waiting = el('div', 'waiting', '思考中');
  answer.appendChild(cursor);
  bot.appendChild(steps);
  bot.appendChild(answer);
  bot.appendChild(waiting);
  log.appendChild(bot);
  scrollDown();

  input.value = '';
  input.style.height = 'auto';
  setRunning(true);

  const t0 = performance.now();
  let ttftShown = false;
  let currentStepNo = null;
  let thinkBox = null;
  let thinkBody = null;

  source = new EventSource('/api/chat?q=' + encodeURIComponent(q));

  source.onmessage = (event) => {
    if (event.data === '[DONE]') { stop(); return; }
    let ev;
    try { ev = JSON.parse(event.data); } catch { return; }

    switch (ev.type) {

      case 'step': {
        currentStepNo = ev.step;
        thinkBox = null;
        break;
      }

      case 'ttft_ready': {
        // 首字还没来之前不计时；真正的首字延迟在第一个 reasoning/content 时算
        break;
      }

      case 'reasoning': {
        markFirstToken();
        if (!thinkBox) {
          thinkBox = el('details', 'think');
          thinkBox.open = false;
          thinkBox.appendChild(el('summary', null, '思考过程'));
          thinkBody = el('div', 'body');
          thinkBox.appendChild(thinkBody);
          steps.appendChild(thinkBox);
        }
        thinkBody.textContent += ev.text;
        break;
      }

      case 'answer_delta': {
        markFirstToken();
        answer.insertBefore(document.createTextNode(ev.text), cursor);
        scrollDown();
        break;
      }

      case 'tool_call': {
        const row = el('div', 'step-row');
        row.appendChild(el('span', 'step-no', '第' + (currentStepNo || '?') + '步'));
        const right = el('div');
        const line = el('div');
        line.appendChild(el('span', 'tool-name', ev.name));
        line.appendChild(el('span', 'tool-args',
          '(' + (Object.keys(ev.args || {}).length
                 ? JSON.stringify(ev.args) : '') + ')'));
        right.appendChild(line);
        right.dataset.pending = '1';
        row.appendChild(right);
        steps.appendChild(row);
        row._right = right;
        source._lastRow = row;
        scrollDown();
        break;
      }

      case 'tool_result': {
        const row = source && source._lastRow;
        if (row) {
          const out = el('div', 'tool-out' + (ev.ok ? '' : ' fail'));
          out.textContent = '→ ' + (ev.result.length > 300
            ? ev.result.slice(0, 300) + ' …' : ev.result);
          row._right.appendChild(out);
          delete row._right.dataset.pending;
          source._lastRow = null;
        }
        scrollDown();
        break;
      }

      case 'retry': {
        const row = el('div', 'step-row');
        row.appendChild(el('span', 'step-no', '重试'));
        row.appendChild(el('span', 'tool-args', ev.text));
        steps.appendChild(row);
        scrollDown();
        break;
      }

      case 'error': {
        bot.appendChild(el('div', 'err-line', ev.message));
        scrollDown();
        break;
      }

      case 'done': {
        const s = ev.stats || {};
        const stats = el('div', 'stats');
        const add = (label, value) => {
          const span = el('span');
          span.appendChild(document.createTextNode(label + ' '));
          span.appendChild(el('b', null, value));
          stats.appendChild(span);
        };
        add('步数', s.steps ?? '-');
        add('LLM 调用', (s.llm_calls ?? '-') + ' 次');
        add('工具', (s.tool_calls ?? '-') + ' 次');
        add('tokens', s.total_tokens ?? '-');
        add('等待 LLM', (s.llm_wait_s ?? '-') + 's');
        add('成本', '¥' + (s.cost_cny ?? 0));
        if (ev.status === 'max_steps_exceeded') {
          stats.appendChild(el('span', 'err-line', '达到步数上限被强制结束'));
        }
        bot.appendChild(stats);
        scrollDown();
        break;
      }
    }
  };

  function markFirstToken() {
    if (ttftShown) return;
    ttftShown = true;
    waiting.remove();
    const ms = performance.now() - t0;
    const span = el('span');
    span.style.cssText = 'font-size:12px;color:var(--muted);margin-right:6px';
    span.textContent = '首字 ' + (ms / 1000).toFixed(2) + 's';
    steps.insertBefore(span, steps.firstChild);
  }

  source.onerror = () => { stop(); };
}

function stop() {
  if (source) { source.close(); source = null; }
  const cursors = document.querySelectorAll('.cursor');
  cursors.forEach(c => c.remove());
  // 停止/出错时把悬着的「思考中」清掉，不然会永远挂在卡片上
  document.querySelectorAll('.waiting').forEach(w => w.remove());
  setRunning(false);
}

function setRunning(running) {
  sendBtn.style.display = running ? 'none' : 'block';
  stopBtn.style.display = running ? 'block' : 'none';
  input.disabled = false;
}

input.focus();
</script>
</body>
</html>
